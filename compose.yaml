services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mdesk
      POSTGRES_USER: mdesk
      POSTGRES_PASSWORD: mdesk_local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - mdesk-auth-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdesk -d mdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mdesk-auth-postgres:
